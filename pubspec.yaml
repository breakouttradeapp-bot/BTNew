name: breakout_trade
description: BreakoutTrade - curated stock breakout charts
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_remote_config: ^5.0.0
  google_mobile_ads: ^5.0.0
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  shimmer: ^3.0.0
  device_info_plus: ^10.0.0
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  timeago: ^3.6.0
  flutter_animate: ^4.5.0
  photo_view: ^0.15.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
